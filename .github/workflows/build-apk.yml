name: Build APK

on:
  push:
    branches: [ claude/whatsapp-sticker-uploader-qzR5l ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build APK with Gradle
      run: |
        cd whatsapp-sticker-uploader
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1 | tee build.log
        echo "Exit code: $?"

    - name: Verify APK exists
      run: |
        APK="whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK" ]; then
          echo "✅ APK creata con successo!"
          ls -lh "$APK"
        else
          echo "❌ APK non trovata"
          tail -50 whatsapp-sticker-uploader/build.log
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp-Sticker-Uploader-APK
        path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
