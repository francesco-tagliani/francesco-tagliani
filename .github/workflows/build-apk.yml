name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > whatsapp-sticker-uploader/local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x whatsapp-sticker-uploader/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: whatsapp-sticker-uploader

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerUploader-debug-apk
          path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
