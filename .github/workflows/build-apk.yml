name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Platforms:"
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "Build-tools:"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "No build-tools dir"
          java -version 2>&1

      - name: Accept SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Ensure platform-33 is available
        run: |
          # Try to install (may already be present)
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;33.0.2" 2>&1 | tail -10 || true
          # Verify it's actually available
          if [ -d "/usr/local/lib/android/sdk/platforms/android-33" ]; then
            echo "OK: android-33 is available"
          else
            echo "WARN: android-33 not found, listing what is available:"
            ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > whatsapp-sticker-uploader/local.properties
          cat whatsapp-sticker-uploader/local.properties

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        working-directory: whatsapp-sticker-uploader

      - name: Post failure log as PR comment
        if: failure() || steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Build Failed"
            echo ""
            echo "Build step outcome: ${{ steps.build.outcome }}"
            echo ""
            echo "Last 100 lines of Gradle output:"
            echo '```'
            tail -100 /tmp/build.log 2>/dev/null || echo "No build output (failure before build step)"
            echo '```'
          } > /tmp/comment.md
          gh pr comment 1 \
            --repo francesco-tagliani/francesco-tagliani \
            --body-file /tmp/comment.md

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerUploader-debug-apk
          path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
