name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "_build_log.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Platforms:"
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "Build-tools:"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "No build-tools dir"
          java -version 2>&1

      - name: Accept SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Ensure platform-34 is available
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -10 || true
          if [ -d "/usr/local/lib/android/sdk/platforms/android-34" ]; then
            echo "OK: android-34 available"
          else
            echo "WARN: android-34 not found, platforms present:"
            ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > whatsapp-sticker-uploader/local.properties
          cat whatsapp-sticker-uploader/local.properties

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        working-directory: whatsapp-sticker-uploader

      - name: Commit debug log to branch
        if: always()
        run: |
          {
            echo "=== BUILD STEP OUTCOME: ${{ steps.build.outcome }} ==="
            echo ""
            echo "=== BUILD LOG ==="
            cat /tmp/build.log 2>/dev/null || echo "NO BUILD LOG"
          } > _build_log.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _build_log.txt
          git diff --staged --quiet && echo "No changes" || git commit -m "CI debug: log [skip ci]"
          git push origin HEAD:claude/whatsapp-sticker-uploader-qzR5l || true

      - name: Fail if build failed
        if: always() && steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerUploader-debug-apk
          path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
