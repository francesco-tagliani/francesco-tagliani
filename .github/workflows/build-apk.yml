name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_DIR" > whatsapp-sticker-uploader/local.properties
          echo "Android SDK: $SDK_DIR"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: whatsapp-sticker-uploader

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerUploader-debug-apk
          path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
