name: Build APK

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > whatsapp-sticker-uploader/local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
        working-directory: whatsapp-sticker-uploader

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppStickerUploader-debug-apk
          path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
