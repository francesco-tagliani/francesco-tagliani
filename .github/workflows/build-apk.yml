name: Build APK

on:
  push:
    branches: [ claude/whatsapp-sticker-uploader-qzR5l ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Build APK with Gradle
      run: |
        cd whatsapp-sticker-uploader
        chmod +x gradlew
        ./gradlew assembleDebug --info 2>&1 | tee build.log

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: apk
        path: whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk

    - name: Comment build result
      if: always()
      run: |
        if [ -f "whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk" ]; then
          ls -lh whatsapp-sticker-uploader/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK Build Successful! Check artifacts for download."
        else
          echo "❌ APK Build Failed"
          tail -100 whatsapp-sticker-uploader/build.log 2>/dev/null || echo "Build log not found"
        fi
